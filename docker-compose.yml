# Parsewright local stack. Every secret comes from .env (see .env.example).
# Published to the host (127.0.0.1 only): Splunk Web, the web UI, and PostgreSQL on 55432
# (for the CLI on the host; 5432 is often Splunk 10's own internal PostgreSQL, and 543x ports
# are often taken by other local services).
# Internal only: Splunk management port 8089.
name: parsewright

services:
  splunk:
    image: splunk/splunk:10.6.1
    # The image runs as the unprivileged "ansible" user and starts splunkd as "splunk".
    environment:
      SPLUNK_START_ARGS: ${SPLUNK_START_ARGS:?set SPLUNK_START_ARGS in .env to accept the Splunk license}
      SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS:?set SPLUNK_GENERAL_TERMS in .env to accept the Splunk General Terms}
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SPLUNK_WEB_PORT:-8000}:8000"
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
      # The engine's add-on packages, read-only for Splunk (Q6, T5.9).
      - packages:/opt/parsewright/packages:ro
    restart: unless-stopped

  postgres:
    image: postgres:17.11-alpine
    # The entrypoint drops to the unprivileged "postgres" user. Localhost only, for the CLI.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # One-shot: migrations and the app role's password. The only service with the database
  # owner's credentials; the engine itself connects as the limited parsewright_app role.
  migrate:
    build: ./engine
    command: ["parsewright", "--env-file", "/dev/null", "migrate"]
    environment:
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    restart: "no"

  # The engine (API + worker pool), non-root, no Docker socket, no capabilities, read-only
  # root filesystem. The web UI (Phase 6) still sits behind the "app" profile.
  engine:
    build: ./engine
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8080}:8080"
    volumes:
      - packages:/opt/parsewright/packages
      - runs:/app/.runs
    environment:
      DATABASE_URL: postgresql://parsewright_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB}
      PARSEWRIGHT_TEST_INDEX: ${PARSEWRIGHT_TEST_INDEX:-pw_test}
      ALLOWED_HOSTS: localhost,127.0.0.1,engine
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      SPLUNK_HOST: splunk
      SPLUNK_PORT: "8089"
      SPLUNK_SEARCH_TOKEN: ${SPLUNK_SEARCH_TOKEN:?set SPLUNK_SEARCH_TOKEN in .env}
      SPLUNK_DEPLOY_TOKEN: ${SPLUNK_DEPLOY_TOKEN:?set SPLUNK_DEPLOY_TOKEN in .env}
      SPLUNK_DRIFT_TOKEN: ${SPLUNK_DRIFT_TOKEN:?set SPLUNK_DRIFT_TOKEN in .env}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL in .env}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      splunk:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  web:
    profiles: ["app"]
    build: ./web
    environment:
      ENGINE_URL: http://engine:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - engine
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  splunk-etc:
  splunk-var:
  pgdata:
  packages:
  runs:
