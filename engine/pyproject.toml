[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "parsewright"
version = "0.0.0"
description = "Turns raw sample logs into a tested, CIM-compliant Splunk add-on."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "psycopg[binary]>=3.3",
    "splunk-sdk>=2.1",  # 3.x requires Python 3.13
    "openai>=3.39",
    "regex>=2026.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "bandit>=1.9",
    "pip-audit>=2.10",
    "pre-commit>=4.7",
]

[tool.hatch.build.targets.wheel]
packages = ["parsewright"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
